name: Feature request
description: Propose a concrete improvement to the package.
labels: ["Design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user workflow and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and how it fits the package scope.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: List observable outcomes that would demonstrate the improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
